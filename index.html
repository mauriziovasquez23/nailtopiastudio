<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nailtopia Studio · Reserva tu cita</title>
<style>
:root{
  --bg:#FDFCFA;
  --rose:#F3CECB;
  --wine:#A77379;
  --mauve:#D2BDC2;
  --ink:#5a4a4d;
  --ink-soft:#8a777b;
  --line:#ece2e3;
  --white:#ffffff;
  --radius:20px;
}
@font-face{font-family:'Century Gothic';src:local('Century Gothic'),local('CenturyGothic');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Century Gothic','Questrial','Twentieth Century',-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
  letter-spacing:.01em;
}
.wrap{max-width:560px;margin:0 auto;padding:38px 20px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100%}
/* logo */
.logo{width:230px;max-width:62vw;margin:8px auto 4px;display:block}
.tag{font-size:13px;color:var(--ink-soft);letter-spacing:.16em;text-transform:uppercase;margin-bottom:30px}
/* card */
.card{width:100%;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 40px rgba(167,115,121,.08);overflow:hidden}
/* view switch */
.switch{display:flex;justify-content:center;gap:4px;padding:14px 16px 0}
.switch button{flex:1;max-width:110px;padding:8px 0;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink-soft);border-radius:11px;cursor:pointer;letter-spacing:.04em;transition:.18s}
.switch button.on{background:var(--rose);color:var(--wine);font-weight:600}
/* header date nav */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 16px 6px}
.cal-nav .arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--wine);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.cal-nav .arr:hover{background:var(--rose)}
.cal-nav .lbl{font-size:15px;font-weight:600;letter-spacing:.02em;min-width:170px;text-transform:capitalize}
.cal-body{padding:6px 16px 22px}
/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.mgrid .dow{font-size:11px;color:var(--ink-soft);letter-spacing:.08em;padding:6px 0;text-transform:uppercase}
.mgrid .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:11px;cursor:pointer;transition:.15s;border:1px solid transparent}
.mgrid .cell:hover:not(.muted):not(.closed){background:var(--rose);color:var(--wine)}
.mgrid .cell.muted{color:#d8cdce;cursor:default}
.mgrid .cell.closed{color:#d8cdce;cursor:default;text-decoration:line-through}
.mgrid .cell.today{border-color:var(--mauve);font-weight:600}
.mgrid .cell.sel{background:var(--wine);color:#fff}
/* week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 16px}
.wstrip .wd{padding:9px 2px;border-radius:13px;cursor:pointer;border:1px solid var(--line);transition:.15s}
.wstrip .wd .dn{font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.wstrip .wd .dd{font-size:17px;font-weight:600;margin-top:2px}
.wstrip .wd.sel{background:var(--wine);border-color:var(--wine);color:#fff}
.wstrip .wd.sel .dn{color:rgba(255,255,255,.8)}
.wstrip .wd.closed{opacity:.4;cursor:default}
/* day label */
.day-h{font-size:15px;font-weight:600;margin:6px 0 14px;text-transform:capitalize}
/* time blocks */
.blocks{display:flex;flex-direction:column;gap:9px}
.block{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--white);transition:.16s;font-size:15px}
.block:hover{border-color:var(--wine);background:#fdf6f6;transform:translateY(-1px)}
.block .bt{font-weight:600;letter-spacing:.02em}
.block .bs{font-size:12px;color:var(--wine)}
.block.full{opacity:.45;cursor:default;background:#faf7f7}
.block.full:hover{transform:none;border-color:var(--line)}
.block.full .bs{color:var(--ink-soft)}
.block.avail{border-color:var(--wine);background:#fdf6f6}
.block.avail:hover{background:#f9ecec;transform:translateY(-1px)}
.block.avail .bs{color:var(--wine);font-weight:600}
.block.avail.urgente{border-color:#b05050;background:#fdf0f0}
.block.avail.urgente .bs{color:#b05050}
.block.lunch{opacity:.5;cursor:default;background:#fafaf7;border-style:dashed}
.block.lunch:hover{transform:none;border-color:var(--line)}
.block.lunch .bt{color:var(--ink-soft);font-weight:500}
.block.lunch .bs{color:var(--ink-soft)}
.empty{padding:30px 10px;color:var(--ink-soft);font-size:14px}
/* address */
.addr{margin-top:30px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;max-width:330px}
.addr .a-t{color:var(--wine);font-weight:600;letter-spacing:.04em;margin-bottom:3px}
.addr a{color:var(--wine);text-decoration:none}
.foot{margin-top:26px;font-size:11px;color:#c9bcbe;letter-spacing:.1em;text-transform:uppercase}
/* popup */
.pop-bg{position:fixed;inset:0;background:rgba(90,74,77,.32);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.pop-bg.show{display:flex}
.book-btn{width:100%;border:none;border-radius:16px;padding:15px 18px;background:var(--wine);color:#fff;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:.18s}
.book-btn:disabled{opacity:.45;cursor:not-allowed}
.book-err{display:none;margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#fbeaea;color:#9c3b3b;font-size:13px;line-height:1.45}
.book-ok{padding:26px 22px 8px;text-align:center}
.book-ok .ic{font-size:40px;margin-bottom:8px}
.book-ok .t{font-size:19px;font-weight:600;color:var(--wine);margin-bottom:6px}
.book-ok .s{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5}
.book-ok .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-size:14px;line-height:1.8}
.book-ok .card b{color:var(--wine)}
.book-ok .code{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
.alt-link{display:block;text-align:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
@media(min-width:560px){.pop-bg{align-items:center;padding:20px}}
.pop{width:100%;max-width:440px;background:var(--bg);border-radius:24px 24px 0 0;max-height:94vh;overflow:auto;animation:rise .3s ease}
@media(min-width:560px){.pop{border-radius:24px}}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
.pop-h .t{font-size:18px;font-weight:600;color:var(--wine)}
.pop-x{width:32px;height:32px;border:none;background:var(--white);border-radius:50%;font-size:15px;color:var(--ink-soft);cursor:pointer}
.pop-b{padding:14px 22px 4px;text-align:left}
.lbl{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 6px;display:block}
.lbl:first-child{margin-top:6px}
.in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:var(--white);color:var(--ink)}
.in:focus{outline:none;border-color:var(--wine)}
.two{display:flex;gap:10px}.two>div{flex:1}
/* adicionales chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border:1px solid var(--line);border-radius:20px;background:var(--white);font-size:13px;cursor:pointer;transition:.15s;color:var(--ink)}
.chip.on{background:var(--rose);border-color:var(--rose);color:var(--wine);font-weight:600}
/* wa button */
.pop-foot{padding:18px 22px 24px;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.wa-btn{width:100%;padding:15px;border:none;border-radius:15px;background:#25D366;color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.18s;letter-spacing:.02em}
.wa-btn:hover{background:#1eb858}
.wa-btn:disabled{background:#cdd6d1;cursor:not-allowed}
.wa-hint{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:9px}
.loading{padding:40px;color:var(--ink-soft);font-size:14px}
.summary{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:13.5px;margin-top:6px}
.summary .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-soft)}
.summary .row b{color:var(--ink);font-weight:600}
</style>
</head>

// bloques de 2h disponibles para un día
function blocksFor(date){
  const cfg=dayCfg(date);
  if(!cfg||!cfg.open||!cfg.close)return null; // cerrado
  const openH=hourOf(cfg.open), closeH=hourOf(cfg.close);
  const lunchS=cfg.lunch?hourOf(cfg.lunch[0]):null;
  const lunchE=cfg.lunch?hourOf(cfg.lunch[1]):null;
  const dayStaff=staff.filter(s=>staffWorks(s,date));
  const dayIds=new Set(dayStaff.map(s=>s.id));
  const totalMani=dayStaff.length;
  if(!totalMani)return [];
  const now=new Date();
  const out=[];
  let h=openH;
  while(h+BLOCK_H<=closeH){
    if(lunchS!=null && h<lunchE && (h+BLOCK_H)>lunchS){
      if(!out.find(x=>x.lunch)) out.push({h:lunchS,full:true,lunch:true});
      h=lunchE;
      continue;
    }
    const bStart=new Date(date.getFullYear(),date.getMonth(),date.getDate(),h,0,0).getTime();
    const bEnd=new Date(date.getFullYear(),date.getMonth(),date.getDate(),h+BLOCK_H,0,0).getTime();
    const ocupadas=new Set();
    busy.forEach(b=>{
      const s=b._s||new Date(b.starts_at).getTime();
      const e=b._e||new Date(b.ends_at||b.starts_at).getTime();
      if(s<bEnd && e>bStart && b.staff_id && dayIds.has(b.staff_id))ocupadas.add(b.staff_id);
    });
    const pasado=bStart<now.getTime()+60*60*1000; // se reserva con al menos 1 h de anticipación
    const libres=pasado?0:Math.max(0,totalMani-ocupadas.size);
    const full=libres===0;
    out.push({h,full,libres,total:totalMani});
    h+=BLOCK_H;
  }
  return out;
}
function blockLabel(h){
  const f=x=>{const ap=x>=12?'pm':'am';let hh=x%12;if(hh===0)hh=12;return hh+' '+ap;};
  return f(h)+' – '+f(h+BLOCK_H);
}
function blockLabelFull(h){
  // versión con hora exacta ej: "10 am – 12 pm"
  const f=x=>{const ap=x>=12?'pm':'am';let hh=x%12;if(hh===0)hh=12;return hh+' '+ap;};
  return f(h)+' – '+f(h+BLOCK_H);
}

function weekBounds(d){const off=(d.getDay()+6)%7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off);const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);return {mon,sun};}

function renderMonth(){
  const y=cur.getFullYear(),mo=cur.getMonth();
  const first=new Date(y,mo,1);let lead=(first.getDay()+6)%7;const days=new Date(y,mo+1,0).getDate();
  const today=new Date();
  let h='<div class="mgrid">';
  ['L','M','M','J','V','S','D'].forEach(d=>h+='<div class="dow">'+d+'</div>');
  for(let i=0;i<lead;i++)h+='<div class="cell muted"></div>';
  for(let dd=1;dd<=days;dd++){
    const dt=new Date(y,mo,dd);
    const cfg=dayCfg(dt);
    const closed=!cfg||!cfg.open;
    const past=dt<new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const cls=closed||past?'closed':'';
    const tod=sameDay(dt,today)?' today':'';
    h+='<div class="cell '+cls+tod+'" '+(!closed&&!past?'onclick="goDay('+y+','+mo+','+dd+')"':'')+'>'+dd+'</div>';
  }
  h+='</div>';
  return h;
}
function renderWeek(){
  const {mon}=weekBounds(cur);const today=new Date();
  let h='<div class="wstrip">';
  for(let i=0;i<7;i++){
    const dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    const cfg=dayCfg(dt);const closed=!cfg||!cfg.open;
    const seld=sameDay(dt,cur)?' sel':'';
    h+='<div class="wd'+(closed?' closed':'')+seld+'" '+(!closed?'onclick="pickWeekDay('+dt.getFullYear()+','+dt.getMonth()+','+dt.getDate()+')"':'')+'><div class="dn">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]+'</div><div class="dd">'+dt.getDate()+'</div></div>';
  }
  h+='</div>';
  // mostrar bloques del día seleccionado (cur)
  h+='<div class="day-h">'+DOWS[cur.getDay()]+' '+cur.getDate()+' de '+MONS[cur.getMonth()]+'</div>';
  h+=renderBlocks(cur);
  return h;
}
function renderDay(date){
  return renderBlocks(date);
}
function renderBlocks(date){
  const blocks=blocksFor(date);
  if(!blocks)return '<div class="empty">Cerrado este día 🌸</div>';
  const avail=blocks.filter(b=>!b.full);
  if(!avail.length)return '<div class="blocks">'+blocks.map(b=>blockHtml(date,b)).join('')+'</div><div class="empty" style="padding:14px">No quedan turnos libres este día. Prueba otro 💕</div>';
  return '<div class="blocks">'+blocks.map(b=>blockHtml(date,b)).join('')+'</div>';
}
function blockHtml(date,b){
  if(b.lunch){
    return '<div class="block lunch"><span class="bt">🍽 Refrigerio</span><span class="bs">'+blockLabel(b.h)+'</span></div>';
  }
  if(b.full){
    return '<div class="block full"><span class="bt">'+blockLabel(b.h)+'</span><span class="bs">No disponible</span></div>';
  }
  const urgencia=b.libres===1?' urgente':'';
  const lbl=b.libres===b.total?(b.libres+' turno'+(b.libres===1?'':'s')+' disponible'+(b.libres===1?'':'s')):(b.libres===1?'¡Último turno!':b.libres+' turnos disponibles');
  return '<div class="block avail'+urgencia+'" onclick="openPop(\''+ymd(date)+'\','+b.h+')">'
    +'<span class="bt">'+blockLabel(b.h)+'</span>'
    +'<span class="bs">'+lbl+' →</span>'
    +'</div>';
}

    +'<div class="t">¡Listo, '+name.split(' ')[0].replace(/</g,'')+'!</div>'
    +'<div class="s">Tu cita quedó reservada. Te escribiremos por WhatsApp para confirmarla.</div>'
    +'<div class="card"><b>Día:</b> '+fecha+'<br><b>Hora:</b> '+hora+'<br><b>Servicio:</b> '+window._lastBooking.sv+'<br><b>Manicurista:</b> '+(d.staff||'Por asignar')
    +(Number(d.price)>0?'<br><b>Precio referencial:</b> S/'+Number(d.price).toFixed(0):'')+'</div>'
    +'<div class="code">CÓDIGO '+d.code+'</div>'
    +'<button class="wa-btn" style="margin-top:16px" onclick="sendBookedWA()">Avisar por WhatsApp (opcional)</button>'
    +'<button class="alt-link" type="button" onclick="closePop()">Cerrar</button></div>';
  document.getElementById('popFoot').style.display='none';
}
function sendBookedWA(){
  const b=window._lastBooking;if(!b)return;
  const msg='Hola! Acabo de reservar en la web 💅\n\nNombre: '+b.name+'\nDía: '+b.fecha+'\nHora: '+b.hora+'\nServicio: '+b.sv+'\nManicurista: '+(b.d.staff||'Por asignar')+'\nCódigo: '+b.d.code+'\n\n¡Gracias! 💕';
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg),'_blank');
}
function prettyDate(s){const d=new Date(s+'T00:00:00');return DOWS[d.getDay()]+' '+d.getDate()+' de '+MONS[d.getMonth()];}
function prettyTime(t){const[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';let hh=h%12;if(hh===0)hh=12;return hh+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
function sendWA(){
  const date=document.getElementById('p-date').value;
  const time=document.getElementById('p-time').value;
  const svId=document.getElementById('p-service').value;
  const stId=document.getElementById('p-staff').value;
  const name=document.getElementById('p-name').value.trim();
  if(!name)return;
  const sv=services.find(x=>x.id===svId);
  const st=staff.find(x=>x.id===stId);
  const adic=[...selComps].map(id=>{const c=comps.find(x=>x.id===id);return c?c.name:null;}).filter(Boolean);
  let msg='Hola! Quiero agendar una cita en Nailtopia Studio 💅\n\n';
  msg+='Nombre: '+name+'\n';
  const ph=(document.getElementById('p-phone')||{}).value||'';if(ph.trim())msg+='Celular: '+ph.trim()+'\n';
  msg+='Día: '+prettyDate(date)+'\n';
  msg+='Hora: '+prettyTime(time)+'\n';
  msg+='Servicio: '+(sv?sv.name+(sv.system_type?' ('+sv.system_type+')':''):'—')+'\n';
  if(adic.length)msg+='Adicionales: '+adic.join(', ')+'\n';
  msg+='Manicurista: '+(st?st.full_name:'Sin preferencia')+'\n';
  msg+='\n¿Me confirman disponibilidad? Gracias 💕';
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg),'_blank');
}

document.getElementById('waLink').href='https://wa.me/'+WA_NUMBER;
boot();
</script>
